# Consola Nexo (web) - servidor NGINX.
#
# La imagen copia este archivo como /etc/nginx/templates/default.conf.template: al iniciar,
# la imagen oficial de NGINX reemplaza ${NEXO_CSP_CONNECT_SRC} y ${NEXO_CSP_FRAME_SRC} con
# variables de entorno (por ejemplo la URL de la API y del Keycloak de SUBTEL).
#
# /config.json se lee desde /etc/nexo/config.json: monte ahí un ConfigMap o un volumen con la
# configuración del ambiente (apiBaseUrl, proveedor de identidad, rótulos).

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/csv application/javascript application/json image/svg+xml;

    # Encabezados de seguridad (también en respuestas de error). Ninguna "location" usa
    # add_header, para que todas hereden estos encabezados.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src ${NEXO_CSP_CONNECT_SRC}; frame-src ${NEXO_CSP_FRAME_SRC}; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Configuración del ambiente, montable y nunca en caché.
    location = /config.json {
        alias /etc/nexo/config.json;
        default_type application/json;
        expires -1;
    }

    # Service worker del modo simulado: siempre la versión actual.
    location = /mockServiceWorker.js {
        expires -1;
        try_files $uri =404;
    }

    # Recursos con hash en el nombre: caché larga.
    location /assets/ {
        expires max;
        access_log off;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Aplicación de una sola página: cualquier ruta de la Consola sirve index.html.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
