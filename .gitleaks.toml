# Credenciales de laboratorio documentadas a propósito (no son secretos reales).
[extend]
useDefault = true

[allowlist]
description = "Valores de laboratorio en archivos de ejemplo"
paths = [
  '''deploy/compose/\.env\.example''',
  # Evidencia de la prueba de rendimiento (SHA-256 citado en la oferta; no se edita): los JWT son del Keycloak
  # local del laboratorio, de corta vida y ya vencidos; no dan acceso a nada fuera del laboratorio.
  '''release/rendimiento/[^/]+/k6-[a-z0-9-]+\.json''',
  '''deploy/compose/keycloak/realm-nexo\.json''',
]
# Falsos positivos revisados uno a uno:
#  - URL JDBC sin contraseña (la contraseña viene de una variable de entorno).
#  - Clave publicable inventada en las pruebas de la mesa de soporte (formato sb_publishable_, no existe).
#  - Token inventado de la prueba de lectura de secretos de la Consola (apps/console-api/src/common/common.test.ts).
#  - Token de laboratorio del backend de demostración para inyectar fallas (valor por omisión en services/demo-backends/src/server.ts), mostrado en el video D-04.
regexTarget = "line"
regexes = [
  '''jdbc:postgresql://[a-z0-9.-]+:\d+/[a-z_]+''',
  '''sb_publishable_0123456789abcdef''',
  '''NEXO_PRUEBA_TOKEN = "desde-variable-0123456789"''',
  '''x-chaos-token: nexo-lab-chaos''',
]
