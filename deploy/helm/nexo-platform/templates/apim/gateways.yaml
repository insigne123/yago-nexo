{{- /*
WSO2 Universal Gateway 4.7.0: uno por audiencia (operadores y público), cada uno con su Deployment, Service,
Ingress y autoescalamiento. Un gateway solo sincroniza las APIs desplegadas en sus ambientes.
*/ -}}
{{- range $clave := splitList "," (include "nexo.gateways" .) }}
{{- if $clave }}
{{- $cfg := fromYaml (include "nexo.gatewayCfg" (dict "ctx" $ "clave" $clave)) }}
{{- $comp := printf "gw-%s" $clave }}
{{- $ctx := dict "ctx" $ "comp" $comp "cfg" $cfg "rol" "gateway" }}
{{- $nombre := include "nexo.nombre" $ctx }}
{{- $hosts := list }}
{{- range $cfg.ambientes }}{{ $hosts = append $hosts .vhost }}{{ end }}
{{- $hostsWs := list }}
{{- range $cfg.ingress.websocket }}{{ $hostsWs = append $hostsWs .host }}{{ end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $nombre }}
  labels:
    {{- include "nexo.etiquetas" $ctx | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $nombre }}
  labels:
    {{- include "nexo.etiquetas" $ctx | nindent 4 }}
  {{- include "nexo.incluir" (dict "plantilla" "nexo.anotacionesServicioHttps" "datos" (dict "ctx" $ "puertos" (list "https" "wss") "backendConfig" (ternary $nombre "" (eq $.Values.global.ingress.proveedor "gce")) "extra" $cfg.service.annotations) "indent" 2) }}
spec:
  type: ClusterIP
  selector:
    {{- include "nexo.selector" $ctx | nindent 4 }}
  ports:
    - { name: https, port: 8243, targetPort: https }
    - { name: http, port: 8280, targetPort: http }
    - { name: wss, port: 8099, targetPort: wss }
    - { name: ws, port: 9099, targetPort: ws }
    - { name: websub-https, port: 8021, targetPort: websub-https }
    - { name: websub-http, port: 9021, targetPort: websub-http }
    - { name: admin, port: 9443, targetPort: admin }
    {{- if $.Values.apim.metricasJmx.enabled }}
    - { name: metricas, port: 9404, targetPort: metricas }
    {{- end }}
    {{- if $.Values.apim.registros.enabled }}
    - { name: fb-metricas, port: 2021, targetPort: fb-metricas }
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $nombre }}
  labels:
    {{- include "nexo.etiquetas" $ctx | nindent 4 }}
spec:
  {{- if not $cfg.hpa.enabled }}
  replicas: {{ $cfg.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "nexo.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexo.etiquetas" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ include "nexo.toml.gw" (dict "ctx" $ "clave" $clave "gw" $cfg) | sha256sum }}
        {{- with $cfg.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "nexo.podComun" $ctx | nindent 6 }}
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- include "nexo.podSeguridad" (dict "uid" 802) | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "nexo.imagen" (dict "ctx" $ "img" $cfg.image) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          env:
            {{- include "nexo.apim.env" (dict "ctx" $ "bd" false) | nindent 12 }}
            - name: JVM_MEM_OPTS
              value: {{ include "nexo.jvm" (dict "ctx" $ "cfg" $cfg "jmx" true) | quote }}
          ports:
            - { name: https, containerPort: 8243 }
            - { name: http, containerPort: 8280 }
            - { name: wss, containerPort: 8099 }
            - { name: ws, containerPort: 9099 }
            - { name: websub-https, containerPort: 8021 }
            - { name: websub-http, containerPort: 9021 }
            - { name: admin, containerPort: 9443 }
            - { name: admin-http, containerPort: 9763 }
            {{- if $.Values.apim.metricasJmx.enabled }}
            - { name: metricas, containerPort: 9404 }
            {{- end }}
          {{- include "nexo.sondasWso2" (dict "cfg" $cfg "listaGateway" true) | nindent 10 }}
          {{- include "nexo.preStop" (dict "segundos" 15) | nindent 10 }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          securityContext:
            {{- include "nexo.contenedorSeguridad" (dict) | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /home/wso2carbon/wso2-config-volume/repository/conf/deployment.toml
              subPath: deployment.toml
              readOnly: true
            {{- if $.Values.apim.registros.enabled }}
            - name: registros
              mountPath: {{ $cfg.directorio }}/repository/logs
            {{- end }}
            {{- include "nexo.incluir" (dict "plantilla" "nexo.apim.montajesSeguridad" "datos" (dict "ctx" $ "base" "/home/wso2carbon/wso2-config-volume/repository/resources/security") "indent" 12) }}
        {{- if $.Values.apim.registros.enabled }}
        {{- include "nexo.apim.sidecarRegistros" (dict "ctx" $ "rol" "gw") | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $nombre }}
        {{- if $.Values.apim.registros.enabled }}
        {{- include "nexo.apim.volumenesRegistros" (dict "ctx" $ "rol" "gw") | nindent 8 }}
        {{- end }}
        {{- include "nexo.incluir" (dict "plantilla" "nexo.apim.volumenesSeguridad" "datos" (dict "ctx" $) "indent" 8) }}
{{- if $cfg.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $nombre }}
  labels:
    {{- include "nexo.etiquetas" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $nombre }}
  minReplicas: {{ $cfg.hpa.minReplicas }}
  maxReplicas: {{ $cfg.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $cfg.hpa.cpu }}
  behavior:
    # Sube rápido ante un pico y baja con calma (el arranque de un gateway toma minutos).
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - { type: Pods, value: 2, periodSeconds: 60 }
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - { type: Pods, value: 1, periodSeconds: 300 }
{{- end }}
{{- if and $.Values.global.ingress.enabled $cfg.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $nombre }}
  labels:
    {{- include "nexo.etiquetas" $ctx | nindent 4 }}
  {{- include "nexo.incluir" (dict "plantilla" "nexo.ingressAnotaciones" "datos" (dict "ctx" $ "extra" $cfg.ingress.annotations) "indent" 2) }}
spec:
  {{- with $.Values.global.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- include "nexo.incluir" (dict "plantilla" "nexo.ingressTls" "datos" (dict "ctx" $ "hosts" (concat $hosts $hostsWs) "secret" $cfg.ingress.tlsSecret) "indent" 2) }}
  rules:
    {{- range $h := $hosts }}
    - host: {{ $h }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $nombre }}
                port:
                  name: https
    {{- end }}
    {{- range $h := $hostsWs }}
    - host: {{ $h }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $nombre }}
                port:
                  name: wss
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
