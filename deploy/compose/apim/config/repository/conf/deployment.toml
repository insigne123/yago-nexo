# Yago Nexo · WSO2 API Manager 4.7.0 · configuración de LABORATORIO (todo en uno)
# En producción se separan Control Plane, Traffic Manager y Universal Gateway (ver deploy/helm).

[server]
hostname = "apim"
base_path = "${carbon.protocol}://${carbon.host}:${carbon.management.port}"
server_role = "default"

[super_admin]
username = "admin"
password = "$env{APIM_ADMIN_PASSWORD}"
create_admin_account = true

[user_store]
type = "database_unique_id"

[database.apim_db]
type = "postgre"
url = "jdbc:postgresql://postgres:5432/apim_db"
username = "apimadmin"
password = "$env{APIM_DB_PASSWORD}"
driver = "org.postgresql.Driver"
validationQuery = "SELECT 1"

[database.shared_db]
type = "postgre"
url = "jdbc:postgresql://postgres:5432/shared_db"
username = "apimadmin"
password = "$env{APIM_DB_PASSWORD}"
driver = "org.postgresql.Driver"
validationQuery = "SELECT 1"

# Llave de cifrado interno (secretos de Key Managers, llaves de aplicaciones). Fija y compartida
# por todos los nodos: si cambia, WSO2 no puede descifrar lo ya guardado.
[encryption]
key = "$env{APIM_ENCRYPTION_KEY}"

[keystore.tls]
file_name = "wso2carbon.jks"
type = "JKS"
password = "wso2carbon"
alias = "wso2carbon"
key_password = "wso2carbon"

# TLS: solo protocolos vigentes (BT-028).
[transport.https.sslHostConfig.properties]
protocols = "TLSv1.2,TLSv1.3"

[transport.passthru_https.listener.parameters]
HttpsProtocols = "TLSv1.2,TLSv1.3"

[apim]
gateway_type = "Regular"

[[apim.gateway.environment]]
name = "Default"
type = "hybrid"
gateway_type = "Regular"
provider = "wso2"
display_in_api_console = true
description = "Gateway de laboratorio (audiencia interna)"
show_as_token_endpoint_url = true
service_url = "https://localhost:${mgt.transport.https.port}/services/"
username = "${admin.username}"
password = "${admin.password}"
ws_endpoint = "ws://apim:9099"
wss_endpoint = "wss://apim:8099"
http_endpoint = "http://apim:${http.nio.port}"
https_endpoint = "https://apim:${https.nio.port}"
websub_event_receiver_http_endpoint = "http://apim:9021"
websub_event_receiver_https_endpoint = "https://apim:8021"

[apim.sync_runtime_artifacts.gateway]
# "Publico" lo atiende un gateway dedicado (gw-publico), separado de las demás audiencias (BT-020).
gateway_labels = ["Default", "Desarrollo", "QA", "Operadores"]

[[oauth.extensions.token_types]]
name = "JWT"
issuer = "org.wso2.is.key.manager.tokenpersistence.issuer.ExtendedJWTTokenIssuer"

# Analítica en modo log (ELK): los eventos van a apim_metrics.log y Fluent Bit los envía a
# OpenSearch. No se usa la analítica en la nube de WSO2.
[apim.analytics]
enable = true
type = "elk"

# Funciones de IA que dependen de servicios externos de WSO2: apagadas.
[apim.ai]
enable = false

# Autorregistro en el portal de desarrolladores (D-08); la cuenta queda pendiente de aprobación.
[identity_mgt.user_self_registration]
allow_self_registration = true
lock_on_creation = false

[apim.key_manager]
enable_lightweight_apikey_generation = true

# Trazas OpenTelemetry hacia el colector (BT-033).
[apim.open_telemetry]
remote_tracer.enable = true
remote_tracer.name = "otlp"
remote_tracer.url = "http://otel-collector:4317"

# Generación de SDK (D-07): al menos tres lenguajes.
[apim.sdk]
group_id = "cl.subtel"
artifact_id = "cl.subtel.client."
model_package = "cl.subtel.client.model."
api_package = "cl.subtel.client.api."
supported_languages = ["java", "javascript", "python", "csharp", "android"]

[apim.cors]
allow_origins = "*"
allow_methods = ["GET", "PUT", "POST", "DELETE", "PATCH", "OPTIONS"]
allow_headers = ["authorization", "Access-Control-Allow-Origin", "Content-Type", "SOAPAction", "apikey", "Internal-Key", "X-Correlation-ID"]
allow_credentials = false

[[event_handler]]
name = "userPostSelfRegistration"
subscriptions = ["POST_ADD_USER"]

[service_provider]
sp_name_regex = "^[\\sa-zA-Z0-9._-]*$"

[database.local]
url = "jdbc:h2:./repository/database/WSO2CARBON_DB;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1"

[[event_listener]]
id = "token_revocation"
type = "org.wso2.carbon.identity.core.handler.AbstractIdentityHandler"
name = "org.wso2.is.notification.ApimOauthEventInterceptor"
order = 1
[event_listener.properties]
notification_endpoint = "https://localhost:${mgt.transport.https.port}/internal/data/v1/notify"
username = "${admin.username}"
password = "${admin.password}"
'header.X-WSO2-KEY-MANAGER' = "default"

[oauth.grant_type.token_exchange]
enable = true
allow_refresh_tokens = true
iat_validity_period = "1h"
