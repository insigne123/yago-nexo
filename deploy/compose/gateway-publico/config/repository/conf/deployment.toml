# Yago Nexo · Universal Gateway dedicado a la audiencia "Público" (BT-020).
# Solo recibe las APIs desplegadas en el ambiente Publico; las de otras audiencias no existen en este nodo.

[server]
hostname = "gw-publico"
server_role = "default"

[user_store]
type = "database_unique_id"

[super_admin]
username = "admin"
password = "$env{APIM_ADMIN_PASSWORD}"
create_admin_account = true

[encryption]
key = "$env{APIM_ENCRYPTION_KEY}"

[keystore.tls]
file_name = "wso2carbon.jks"
type = "JKS"
password = "wso2carbon"
alias = "wso2carbon"
key_password = "wso2carbon"

[truststore]
file_name = "client-truststore.jks"
type = "JKS"
password = "wso2carbon"

[transport.passthru_https.listener.parameters]
HttpsProtocols = "TLSv1.2,TLSv1.3"

# Control plane (en el laboratorio, el API Manager todo en uno).
[apim.key_manager]
service_url = "https://apim:9443/services/"
username = "$ref{super_admin.username}"
password = "$ref{super_admin.password}"

[apim.event_hub]
enable = true
username = "$ref{super_admin.username}"
password = "$ref{super_admin.password}"
service_url = "https://apim:9443/services/"
event_listening_endpoints = ["tcp://apim:5672"]

[apim.sync_runtime_artifacts.gateway]
gateway_labels = ["Publico"]

[apim.throttling]
throttle_decision_endpoints = ["tcp://apim:5672"]

[[apim.throttling.url_group]]
traffic_manager_urls = ["tcp://apim:9611"]
traffic_manager_auth_urls = ["ssl://apim:9711"]

[apim.analytics]
enable = true
type = "elk"

[apim.open_telemetry]
remote_tracer.enable = true
remote_tracer.name = "otlp"
remote_tracer.url = "http://otel-collector:4317"

[apim.cache.gateway_token]
enable = true
expiry_time = 15

[apim.cache.resource]
enable = true

[apim.cache.jwt_claim]
enable = true
expiry_time = 900

[apim.oauth_config]
remove_outbound_auth_header = true
auth_header = "Authorization"

[apim.cors]
allow_origins = "*"
allow_methods = ["GET", "OPTIONS"]
allow_headers = ["authorization", "Content-Type", "X-Correlation-ID"]
allow_credentials = false
