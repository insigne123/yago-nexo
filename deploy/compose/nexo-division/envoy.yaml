# nexo-division (Envoy) · división de tráfico de los despliegues progresivos (D-04).
# Clústeres y rutas llegan por xDS REST desde el motor de despliegues (nexo-motores, puerto 9466); Envoy los
# aplica en caliente cada segundo. Si el plano de control no responde, conserva la última configuración.
node:
  id: nexo-division-1
  cluster: nexo-division
admin:
  # La administración queda solo en localhost; las métricas se exponen aparte, en solo lectura (9902).
  address: { socket_address: { address: 127.0.0.1, port_value: 9901 } }
dynamic_resources:
  cds_config:
    resource_api_version: V3
    api_config_source:
      api_type: REST
      transport_api_version: V3
      cluster_names: [nexo_control]
      refresh_delay: 1s
      request_timeout: 2s
static_resources:
  listeners:
    - name: division
      address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: division
                rds:
                  route_config_name: nexo
                  config_source:
                    resource_api_version: V3
                    api_config_source:
                      api_type: REST
                      transport_api_version: V3
                      cluster_names: [nexo_control]
                      refresh_delay: 1s
                      request_timeout: 2s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
    - name: metricas
      address: { socket_address: { address: 0.0.0.0, port_value: 9902 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: metricas
                route_config:
                  virtual_hosts:
                    - name: metricas
                      domains: ["*"]
                      routes:
                        - { match: { path: /stats/prometheus }, route: { cluster: admin_local } }
                        - { match: { path: /ready }, route: { cluster: admin_local } }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
  clusters:
    - name: nexo_control
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: nexo_control
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: motores, port_value: 9466 } } } }] }]
    - name: admin_local
      type: STATIC
      connect_timeout: 1s
      load_assignment:
        cluster_name: admin_local
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: 127.0.0.1, port_value: 9901 } } } }] }]
