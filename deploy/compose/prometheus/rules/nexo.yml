# Reglas de alerta de Nexo (BT-034). Las verifica `promtool check rules` y sus pruebas unitarias están en
# ../pruebas/nexo.test.yml (`promtool test rules`). El diccionario de métricas y reglas se genera con
# `pnpm --filter @nexo/console-api metricas:diccionario` (../diccionario-metricas.md).
groups:
  - name: nexo-plataforma
    rules:
      - alert: ComponenteCaido
        expr: up == 0
        for: 1m
        labels: { severidad: S2 }
        annotations:
          resumen: "{{ $labels.job }} en {{ $labels.instance }} no responde"
      # Mensajes por cola: RabbitMQ los publica en /metrics/detailed (familia queue_coarse_metrics, job
      # rabbitmq-colas) como rabbitmq_detailed_queue_messages_ready{vhost, queue}. El endpoint agregado (/metrics)
      # publica rabbitmq_queue_messages_ready sin la etiqueta queue, por eso filtrar ahí por la cola nunca coincide.
      - alert: ColaConMensajesFallidos
        expr: sum by (vhost, queue) (rabbitmq_detailed_queue_messages_ready{queue=~".+[.]dlq"}) > 0
        for: 5m
        labels: { severidad: S3 }
        annotations:
          resumen: "La cola de mensajes fallidos {{ $labels.queue }} tiene {{ $value }} mensajes pendientes"
  - name: nexo-gateway
    rules:
      - alert: TasaDeErrorAlta
        expr: 100 * sum by (apiName) (rate(nexo_gateway_counter_solicitudes_total{proxyResponseCode=~"5.."}[5m])) / clamp_min(sum by (apiName) (rate(nexo_gateway_counter_solicitudes_total[5m])), 1e-9) > 5
        for: 5m
        labels: { severidad: S2 }
        annotations:
          resumen: "La API {{ $labels.apiName }} tiene más de 5% de errores 5xx"
      - alert: LatenciaAlta
        expr: histogram_quantile(0.99, sum by (le, apiName) (rate(nexo_gateway_histogram_latencia_ms_bucket[5m]))) > 2000
        for: 10m
        labels: { severidad: S3 }
        annotations:
          resumen: "La latencia p99 de {{ $labels.apiName }} supera 2 s"
