# Prometheus · métricas de la plataforma (BT-034)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: { sitio: lab, plataforma: nexo }

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: nexo-integrator
    metrics_path: /metric-service/metrics
    static_configs: [{ targets: ["mi:9201"], labels: { componente: integrator } }]
  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq:15692"], labels: { componente: colas } }]
  - job_name: keycloak
    static_configs: [{ targets: ["keycloak:9000"], labels: { componente: identidad } }]
  - job_name: backends
    static_configs:
      - targets: ["concesiones-v1:7001", "concesiones-v2:7001", "registro-soap:7001"]
        labels: { componente: backend }
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8888"], labels: { componente: observabilidad } }]
  - job_name: nexo-services
    static_configs:
      - targets: ["console-api:8090", "nexo-guard:8091", "nexo-rollout:8092", "nexo-failover:8093"]
        labels: { componente: nexo }
