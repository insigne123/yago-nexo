# Prometheus · métricas de la plataforma (BT-034)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: { sitio: lab, plataforma: nexo }

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: nexo-integrator
    metrics_path: /metric-service/metrics
    static_configs: [{ targets: ["mi:9201"], labels: { componente: integrator } }]
  - job_name: gateway
    static_configs: [{ targets: ["fluent-bit:2021"], labels: { componente: gateway } }]
  - job_name: gateway-jvm
    static_configs: [{ targets: ["apim:9404"], labels: { componente: gateway } }]
  - job_name: fluent-bit
    metrics_path: /api/v2/metrics/prometheus
    static_configs: [{ targets: ["fluent-bit:2020"], labels: { componente: observabilidad } }]
  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq:15692"], labels: { componente: colas } }]
  - job_name: rabbitmq-colas
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs: [{ targets: ["rabbitmq:15692"], labels: { componente: colas } }]
  - job_name: keycloak
    static_configs: [{ targets: ["keycloak:9000"], labels: { componente: identidad } }]
  - job_name: backends
    static_configs:
      - targets: ["concesiones-v1:7001", "concesiones-v2:7001", "registro-soap:7001"]
        labels: { componente: backend }
  - job_name: nexo-services
    metrics_path: /api/v1/metrics
    static_configs: [{ targets: ["console-api:8090"], labels: { componente: consola } }]
  - job_name: nexo-motores
    static_configs: [{ targets: ["motores:9465"], labels: { componente: motores } }]
  - job_name: nexo-division
    metrics_path: /stats/prometheus
    static_configs: [{ targets: ["nexo-division:9902"], labels: { componente: division } }]
