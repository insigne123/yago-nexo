# Yago Nexo · laboratorio local
# Perfiles: core (siempre), obs (observabilidad), legacy (APISIX y NGINX "actuales"), contracts (Microcks)
# Uso: make up  ·  make status  ·  make down
name: nexo-lab

x-wso2-env: &wso2-env
  APIM_ADMIN_PASSWORD: ${APIM_ADMIN_PASSWORD}
  APIM_ENCRYPTION_KEY: ${APIM_ENCRYPTION_KEY}
  APIM_DB_PASSWORD: ${APIM_DB_PASSWORD}
  MI_ADMIN_PASSWORD: ${MI_ADMIN_PASSWORD}
  MI_DB_PASSWORD: ${MI_DB_PASSWORD}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

services:
  # ------------------------------------------------------------------ datos
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APIM_DB_PASSWORD: ${APIM_DB_PASSWORD}
      NEXO_DB_PASSWORD: ${NEXO_DB_PASSWORD}
      MI_DB_PASSWORD: ${MI_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  apim-dbinit:
    build: ./apim-dbinit
    environment:
      APIM_DB_PASSWORD: ${APIM_DB_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: nexo
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["5672:5672", "15672:15672", "15692:15692"]
    volumes:
      - mqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  # ------------------------------------------------------------------ identidad
  # SSO institucional (en SUBTEL es su Keycloak): base propia, independiente de los sitios de Nexo.
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - kcdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      retries: 20

  keycloak:
    image: keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: http://keycloak:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_KM_CLIENT_SECRET: ${KEYCLOAK_KM_CLIENT_SECRET}
    volumes:
      - ./keycloak/realm-nexo.json:/opt/keycloak/data/import/realm-nexo.json:ro
    ports: ["8080:8080", "9000:9000"]
    depends_on:
      keycloak-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      retries: 30

  # ------------------------------------------------------------------ plataforma
  apim:
    build: ./apim
    image: nexo-lab/apim:4.7.0
    hostname: apim
    environment: *wso2-env
    ports:
      - "9443:9443" # Publisher, Dev Portal, Admin, REST API
      - "8243:8243" # gateway HTTPS
      - "8280:8280" # gateway HTTP
      - "8099:8099" # WebSocket seguro
      - "9099:9099" # WebSocket
      - "9021:9021" # WebSub HTTP
      - "8021:8021" # WebSub HTTPS
      - "9404:9404" # métricas JVM y transporte (JMX → Prometheus)
    volumes:
      - apimlogs:/home/wso2carbon/wso2am-4.7.0/repository/logs
    depends_on:
      apim-dbinit: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://localhost:9443/services/Version | grep -q 200"]
      interval: 15s
      retries: 40
      start_period: 60s

  gw-publico:
    build: ./gateway-publico
    image: nexo-lab/gw-publico:4.7.0
    hostname: gw-publico
    environment: *wso2-env
    ports:
      - "18243:8243" # gateway HTTPS de la audiencia pública
      - "18280:8280"
    volumes:
      - gwpublogs:/home/wso2carbon/wso2am-universal-gw-4.7.0/repository/logs
    depends_on:
      apim: { condition: service_healthy }

  mi:
    build: ./mi
    image: nexo-lab/mi:4.6.0
    hostname: mi
    environment: *wso2-env
    ports:
      - "8290:8290" # HTTP
      - "8253:8253" # HTTPS
      - "9164:9164" # Management API
      - "9201:9201" # métricas Prometheus
    volumes:
      # El entrypoint de WSO2 copia (fusiona) estos artefactos sobre synapse-configs/default al iniciar.
      - ../../wso2/mi/artifacts:/home/wso2carbon/wso2-config-volume/repository/deployment/server/synapse-configs/default:ro
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # ------------------------------------------------------------------ Consola Nexo (API)
  console-api:
    build: ../../apps/console-api/.deploy
    image: nexo-lab/console-api:0.1.0
    hostname: console-api
    environment:
      NEXO_DATABASE_URL: postgres://nexo:${NEXO_DB_PASSWORD}@postgres:5432/nexo
      NEXO_ENVIRONMENT_LABEL: Laboratorio Yago
      NEXO_CORS_ORIGINS: http://localhost:5173,http://localhost:8091
      NEXO_AUTH_JWKS_URL: http://keycloak:8080/realms/nexo/protocol/openid-connect/certs
      NEXO_AUTH_ISSUER: http://keycloak:8080/realms/nexo
      NEXO_WSO2_URL: https://apim:9443
      NEXO_WSO2_PASSWORD: ${APIM_ADMIN_PASSWORD}
      NEXO_MI_URL: https://mi:9164
      NEXO_MI_PASSWORD: ${MI_ADMIN_PASSWORD}
      NEXO_OPENSEARCH_URL: http://opensearch:9200
      NEXO_PROMETHEUS_URL: http://prometheus:9090
      NEXO_RABBITMQ_API: http://rabbitmq:15672/api
      NEXO_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      NEXO_EXPORT_DIR: /tmp/nexo-exports
    ports: ["8090:8090"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  # ------------------------------------------------------------------ motores de Nexo y división de tráfico (D-04)
  motores:
    build:
      context: ../../services/engines
      args: { NSUPDATE: "0" } # el laboratorio cambia el DNS por etcd/CoreDNS, no por RFC 2136
    image: nexo-lab/motores:0.1.0
    hostname: motores
    command: ["despliegues", "guardian", "descubrimiento", "siem"]
    environment:
      NEXO_DATABASE_URL: postgres://nexo:${NEXO_DB_PASSWORD}@postgres:5432/nexo
      NEXO_GUARDIAN_WINDOW_SEC: "30" # laboratorio: ventanas cortas para que la demo sea ágil (producción: 60)
      NEXO_WSO2_URL: https://apim:9443
      NEXO_WSO2_PASSWORD: ${APIM_ADMIN_PASSWORD}
      NEXO_WSO2_INSECURE_TLS: "true"
      NEXO_OPENSEARCH_URL: http://opensearch:9200
      NEXO_ALERTMANAGER_URL: http://alertmanager:9093
      NEXO_DIVISION_URL: http://nexo-division:10000
      NEXO_DIVISION_ADMIN_URLS: http://nexo-division:9902
      # D-01: fuentes de la plataforma "actual" y objetivos de red autorizados (en SUBTEL los define SUBTEL).
      NEXO_DISCOVERY_APISIX_ADMIN: http://apisix:9180
      NEXO_DISCOVERY_APISIX_KEY: ${APISIX_ADMIN_KEY}
      NEXO_DISCOVERY_APISIX_ADDRESS: apisix:9080
      NEXO_DISCOVERY_NGINX_CONF: /etc/nexo/descubrimiento/nginx
      NEXO_DISCOVERY_NGINX_LOG: /var/log/nginx-nexo/access.log
      NEXO_DISCOVERY_NGINX_ADDRESS: nginx-legacy:80
      NEXO_DISCOVERY_TARGETS: ocultas:7001,concesiones-v1:7001,registro-soap:7001,graphql-concesiones:7001
      # Auditoría encadenada hacia el SIEM (en el laboratorio, Fluent Bit → OpenSearch nexo-siem-*).
      NEXO_SIEM_DESTINOS: syslog+tcp://fluent-bit:5140?encuadre=lf
    volumes:
      - ./nginx-legacy:/etc/nexo/descubrimiento/nginx:ro
      - nginxlogs:/var/log/nginx-nexo:ro
    ports: ["9465:9465", "9466:9466"]
    depends_on:
      console-api: { condition: service_healthy } # la API aplica las migraciones

  nexo-division:
    image: envoyproxy/envoy:v1.38.5
    hostname: nexo-division
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    volumes:
      - ./nexo-division/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports: ["10000:10000", "9902:9902"]

  # ------------------------------------------------------------------ backends de ejemplo
  concesiones-v1:
    build: ../../services/demo-backends
    image: nexo-lab/demo-backends:dev
    environment: { MODE: concesiones, VERSION: "1.0.0", PORT: "7001" }
    ports: ["7001:7001"]
  concesiones-v2:
    image: nexo-lab/demo-backends:dev
    environment: { MODE: concesiones, VERSION: "1.1.0", PORT: "7001" }
    ports: ["7011:7001"]
    depends_on: [concesiones-v1]
  registro-soap:
    image: nexo-lab/demo-backends:dev
    environment: { MODE: registro, VERSION: "1.0.0", PORT: "7001" }
    ports: ["7002:7001"]
    depends_on: [concesiones-v1]
  graphql-concesiones:
    image: nexo-lab/demo-backends:dev
    environment: { MODE: graphql, VERSION: "1.0.0", PORT: "7001" }
    ports: ["7004:7001"]
    depends_on: [concesiones-v1]
  eventos:
    image: nexo-lab/demo-backends:dev
    environment: { MODE: eventos, VERSION: "1.0.0", PORT: "7001", EVENT_INTERVAL_MS: "5000" }
    ports: ["7005:7001"]
    depends_on: [concesiones-v1]
  ocultas:
    image: nexo-lab/demo-backends:dev
    environment: { MODE: ocultas, VERSION: "0.9.0", PORT: "7001" }
    ports: ["7003:7001"]
    depends_on: [concesiones-v1]

  # ------------------------------------------------------------------ plataforma "actual" de SUBTEL (para D-01 y migración)
  nginx-legacy:
    profiles: [legacy]
    image: nginx:alpine
    volumes:
      - ./nginx-legacy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginxlogs:/var/log/nginx-nexo
    ports: ["8088:80"]
    depends_on: [ocultas]

  etcd:
    profiles: [legacy]
    image: quay.io/coreos/etcd:v3.6.5
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
    environment:
      ETCD_DATA_DIR: /etcd-data

  apisix:
    profiles: [legacy]
    image: apache/apisix:3.19.0-debian
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports: ["9080:9080", "9180:9180"]
    depends_on: [etcd]

  # ------------------------------------------------------------------ observabilidad
  otel-collector:
    profiles: [obs]
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/config.yaml:/etc/otel/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]
    depends_on: [jaeger]

  jaeger:
    profiles: [obs]
    image: jaegertracing/jaeger:2.21.0
    ports: ["16686:16686"]

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports: ["9090:9090"]

  alertmanager:
    profiles: [obs]
    image: prom/alertmanager:v0.34.1
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]

  grafana:
    profiles: [obs]
    image: grafana/grafana:13.0.10
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_DEFAULT_LANGUAGE: es-ES
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  opensearch:
    profiles: [obs]
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms768m -Xmx768m
      cluster.routing.allocation.disk.threshold_enabled: "false"
    volumes:
      - osdata:/usr/share/opensearch/data
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q -E 'green|yellow'"]
      interval: 10s
      retries: 30

  opensearch-dashboards:
    profiles: [obs]
    image: opensearchproject/opensearch-dashboards:3.9.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports: ["5601:5601"]
    depends_on: [opensearch]

  # Plantillas de índices de OpenSearch (el índice SIEM guarda los detalles como objeto plano).
  opensearch-plantillas:
    profiles: [obs]
    image: curlimages/curl:8.17.0
    command: ["sh", "-c", "curl -sf -X PUT http://opensearch:9200/_index_template/nexo-siem -H 'content-type: application/json' --data-binary @/plantillas/plantilla-siem.json && echo plantillas aplicadas"]
    volumes:
      - ./opensearch:/plantillas:ro
    depends_on:
      opensearch: { condition: service_healthy }
    restart: "no"

  fluent-bit:
    profiles: [obs]
    image: fluent/fluent-bit:5.1.3
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/nexo/fluent-bit.yaml"]
    volumes:
      - ./fluent-bit:/fluent-bit/etc/nexo:ro
      - apimlogs:/wso2/apim/logs:ro
      - fbstorage:/var/fluent-bit/storage
    depends_on:
      opensearch: { condition: service_healthy }
      opensearch-plantillas: { condition: service_completed_successfully }

  # ------------------------------------------------------------------ laboratorio de continuidad de dos sitios (D-05)
  # Perfil "cont": dos PostgreSQL con replicación por streaming (CPD primario, GCP réplica), etcd para el
  # quórum de votos, CoreDNS para el nombre del sitio activo y un agente por sitio. `make continuidad`.
  cont-cpd:
    profiles: [cont]
    image: postgres:16-alpine
    hostname: cont-cpd
    environment:
      POSTGRES_PASSWORD: ${CONT_DB_PASSWORD}
      REPL_PASSWORD: ${REPL_PASSWORD}
    volumes:
      - contcpd:/var/lib/postgresql/data
      - ./continuidad/cpd-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  cont-gcp:
    profiles: [cont]
    image: postgres:16-alpine
    hostname: cont-gcp
    entrypoint: ["/gcp-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_PASSWORD: ${CONT_DB_PASSWORD}
      REPL_PASSWORD: ${REPL_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - contgcp:/var/lib/postgresql/data
      - ./continuidad/gcp-entrypoint.sh:/gcp-entrypoint.sh:ro
    depends_on:
      cont-cpd: { condition: service_healthy }

  cont-etcd:
    profiles: [cont]
    image: quay.io/coreos/etcd:v3.6.5
    hostname: cont-etcd
    command: ["etcd", "--advertise-client-urls=http://cont-etcd:2379", "--listen-client-urls=http://0.0.0.0:2379"]
    environment: { ETCD_DATA_DIR: /etcd-data }

  cont-coredns:
    profiles: [cont]
    image: coredns/coredns:1.12.0
    hostname: cont-coredns
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./continuidad/coredns:/etc/coredns:ro
    depends_on: [cont-etcd]

  cont-agente-cpd: &cont-agente
    profiles: [cont]
    image: nexo-lab/motores:0.1.0
    command: ["continuidad"]
    environment: &cont-env
      NEXO_DATABASE_URL: postgres://nexo:${NEXO_DB_PASSWORD}@postgres:5432/nexo
      NEXO_CONTINUITY_ETCD: http://cont-etcd:2379
      NEXO_CONTINUITY_AUTOMATICO: "true"
      NEXO_CONTINUITY_INTERVAL_MS: "3000"
      NEXO_CONTINUITY_DOWN_CICLOS: "2"
      NEXO_DNS: etcd
      NEXO_DNS_ETCD_URL: http://cont-etcd:2379
      NEXO_DNS_SERVER: cont-coredns:53
      NEXO_DNS_NAME: activo.nexo.lab
      NEXO_PRIMARY_SITE_ID: cpd
      NEXO_PRIMARY_TCP: cont-cpd:5432
      NEXO_PRIMARY_DB_URL: postgres://postgres:${CONT_DB_PASSWORD}@cont-cpd:5432/postgres
      NEXO_REPLICA_DB_URL: postgres://postgres:${CONT_DB_PASSWORD}@cont-gcp:5432/postgres
      NEXO_SITE_IP_CPD: 10.80.0.1
      NEXO_SITE_ID: cpd
      NEXO_SITE_ROLE: primario
      NEXO_SITE_SERVE_IP: 10.80.0.1
    depends_on:
      cont-etcd: { condition: service_started }
      postgres: { condition: service_healthy }

  cont-agente-gcp:
    <<: *cont-agente
    environment:
      <<: *cont-env
      NEXO_SITE_ID: gcp
      NEXO_SITE_ROLE: respaldo
      NEXO_SITE_SERVE_IP: 10.80.0.2

  cont-agente-testigo:
    <<: *cont-agente
    environment:
      <<: *cont-env
      NEXO_SITE_ID: testigo
      NEXO_SITE_ROLE: testigo

volumes:
  gwpublogs:
  pgdata:
  mqdata:
  apimlogs:
  promdata:
  osdata:
  fbstorage:
  nginxlogs:
  kcdata:
  contcpd:
  contgcp:
