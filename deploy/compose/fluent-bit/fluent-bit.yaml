# Fluent Bit · logs de WSO2 hacia OpenSearch y el SIEM, con buffer en disco (BT-032)
service:
  flush: 2
  log_level: info
  http_server: on
  http_port: 2020
  storage.path: /var/fluent-bit/storage
  storage.sync: normal
  storage.checksum: on
  storage.backlog.mem_limit: 64M

parsers:
  - name: wso2_metrics
    format: regex
    regex: '^(?<hora>\d{2}:\d{2}:\d{2},\d{3}) \[(?<origen>[^\]]*)\] \[(?<hilo>[^\]]*)\]\s+(?<nivel>\w+) (?<logger>\S+) apimMetrics: (?<tipo>[^,]+), properties :(?<propiedades>\{.*\})\s*$'
  - name: json_props
    format: json
  - name: wso2_carbon
    format: regex
    regex: '^\[(?<ts>[^\]]+)\]\s+(?<nivel>\w+)\s+\{(?<logger>[^}]*)\}\s+-\s+(?<mensaje>.*)$'
  # Syslog RFC 5424 (la auditoría encadenada de Nexo llega así, como lo haría a un SIEM).
  - name: nexo_rfc5424
    format: regex
    regex: '^\<(?<pri>[0-9]{1,5})\>1 (?<time>[^ ]+) (?<host>[^ ]+) (?<ident>[^ ]+) (?<pid>[-0-9]+) (?<msgid>[^ ]+) (?<extradata>(\[(.*?)\]|-)) (?<message>.+)$'
    time_key: time
    time_format: '%Y-%m-%dT%H:%M:%S.%L%z'
    time_keep: on

pipeline:
  inputs:
    - name: tail
      tag: apim.metrics
      path: /wso2/apim/logs/apim_metrics.log
      parser: wso2_metrics
      db: /var/fluent-bit/storage/tail-apim-metrics.db
      storage.type: filesystem
      read_from_head: true
    - name: tail
      tag: apim.audit
      path: /wso2/apim/logs/audit.log
      db: /var/fluent-bit/storage/tail-apim-audit.db
      storage.type: filesystem
      read_from_head: true
    - name: tail
      tag: apim.carbon
      path: /wso2/apim/logs/wso2carbon.log
      parser: wso2_carbon
      db: /var/fluent-bit/storage/tail-apim-carbon.db
      storage.type: filesystem
      multiline.parser: java

    # Receptor del laboratorio que hace las veces de SIEM: auditoría de Nexo por syslog TCP (RFC 5424).
    - name: syslog
      tag: siem.nexo
      mode: tcp
      listen: 0.0.0.0
      port: 5140
      parser: nexo_rfc5424
      storage.type: filesystem

  filters:
    - name: parser
      match: siem.nexo
      key_name: message
      parser: json_props
      reserve_data: on
    - name: parser
      match: apim.metrics
      key_name: propiedades
      parser: json_props
      reserve_data: on
    - name: modify
      match: "*"
      add:
        - plataforma nexo
        - sitio lab
    # Métricas del gateway a partir de los eventos de analítica (BT-034, BT-021).
    - name: log_to_metrics
      match: apim.metrics
      tag: metricas.gateway
      metric_mode: counter
      metric_name: solicitudes_total
      metric_namespace: nexo_gateway
      metric_description: Solicitudes atendidas por el gateway
      label_field:
        - apiName
        - applicationName
        - proxyResponseCode
        - keyType
    - name: log_to_metrics
      match: apim.metrics
      tag: metricas.gateway
      metric_mode: histogram
      metric_name: latencia_ms
      metric_namespace: nexo_gateway
      metric_description: Latencia de respuesta del gateway en milisegundos
      value_field: responseLatency
      bucket:
        - 5
        - 10
        - 25
        - 50
        - 100
        - 250
        - 500
        - 1000
        - 2500
        - 5000
        - 10000
      label_field:
        - apiName
    - name: log_to_metrics
      match: apim.metrics
      tag: metricas.gateway
      metric_mode: histogram
      metric_name: latencia_backend_ms
      metric_namespace: nexo_gateway
      metric_description: Latencia del sistema de destino en milisegundos
      value_field: backendLatency
      bucket:
        - 5
        - 10
        - 25
        - 50
        - 100
        - 250
        - 500
        - 1000
        - 2500
        - 5000
      label_field:
        - apiName

  outputs:
    - name: prometheus_exporter
      match: metricas.gateway
      host: 0.0.0.0
      port: 2021
    - name: opensearch
      match: apim.metrics
      host: opensearch
      port: 9200
      logstash_format: on
      logstash_prefix: nexo-apim-metrics
      suppress_type_name: on
      retry_limit: no_limits
    - name: opensearch
      match: apim.audit
      host: opensearch
      port: 9200
      logstash_format: on
      logstash_prefix: nexo-audit
      suppress_type_name: on
      retry_limit: no_limits
    - name: opensearch
      match: siem.nexo
      host: opensearch
      port: 9200
      logstash_format: on
      logstash_prefix: nexo-siem
      # El id del evento es el id del documento: un reenvío ("al menos una vez") no duplica.
      id_key: id
      suppress_type_name: on
      retry_limit: no_limits
    - name: opensearch
      match: apim.carbon
      host: opensearch
      port: 9200
      logstash_format: on
      logstash_prefix: nexo-logs
      suppress_type_name: on
      retry_limit: no_limits
