# Simula el NGINX "actual" de SUBTEL, con APIs publicadas fuera del gobierno (para D-01).
# El registro de accesos va a un volumen compartido que el motor de descubrimiento lee en solo lectura.
server {
  listen 80;
  server_name legacy.subtel.lab;
  access_log /var/log/nginx-nexo/access.log combined;

  location /interno/ { proxy_pass http://ocultas:7001; }
  location /legacy/  { proxy_pass http://ocultas:7001; }
  location /health   { return 200 "ok"; }
}
