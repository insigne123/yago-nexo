---
# Inventario de ejemplo: 3 servidores RKE2 y 11 agentes, máquinas virtuales en VMware vSphere.
# Copie esta carpeta a inventario/<sitio>/ y reemplace nombres y direcciones. Las contraseñas van cifradas
# con Ansible Vault (group_vars/all/vault.yml), nunca en texto plano.
all:
  vars:
    ansible_user: nexo-admin
    ansible_python_interpreter: /usr/bin/python3
  children:
    rke2_cluster:
      children:
        rke2_servidores:
          hosts:
            nexo-srv-01:
              ansible_host: 10.10.10.11
            nexo-srv-02:
              ansible_host: 10.10.10.12
            nexo-srv-03:
              ansible_host: 10.10.10.13
        rke2_agentes:
          hosts:
            nexo-wrk-01:
              ansible_host: 10.10.10.21
            nexo-wrk-02:
              ansible_host: 10.10.10.22
            nexo-wrk-03:
              ansible_host: 10.10.10.23
            nexo-wrk-04:
              ansible_host: 10.10.10.24
            nexo-wrk-05:
              ansible_host: 10.10.10.25
            nexo-wrk-06:
              ansible_host: 10.10.10.26
            nexo-wrk-07:
              ansible_host: 10.10.10.27
            nexo-wrk-08:
              ansible_host: 10.10.10.28
            nexo-wrk-09:
              ansible_host: 10.10.10.29
            nexo-wrk-10:
              ansible_host: 10.10.10.30
            nexo-wrk-11:
              ansible_host: 10.10.10.31
