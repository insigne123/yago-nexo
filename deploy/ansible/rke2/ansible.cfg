# Yago Nexo · configuración de Ansible para el instalador RKE2 del CPD.
[defaults]
inventory = inventario/ejemplo/hosts.yml
roles_path = roles
collections_path = colecciones:~/.ansible/collections
host_key_checking = True
forks = 20
timeout = 30
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True
