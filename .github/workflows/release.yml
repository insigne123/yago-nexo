name: Versión

# Publica una versión de Yago Nexo: compila, genera el SBOM, el inventario de licencias y las sumas,
# firma cada artefacto con Sigstore (sin llaves: identidad OIDC de este workflow), publica las imágenes
# propias en GHCR firmadas, y crea la etiqueta y la versión en GitHub.
#
# Se dispara a mano (Actions → Versión → Run workflow) con el número de versión, que debe coincidir con
# apps/site/src/data/release.json, o con un push cuyo mensaje de commit empiece con «Publicar versión »
# (en ese caso la versión se toma de release.json). En ambos casos falla si la etiqueta ya existe.
#
# Verificar un artefacto:
#   cosign verify-blob --bundle <archivo>.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/insigne123/yago-nexo/\.github/workflows/release\.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com <archivo>
# Verificar una imagen:
#   cosign verify ghcr.io/insigne123/nexo-console-api:<versión> \
#     --certificate-identity-regexp '^https://github.com/insigne123/yago-nexo/\.github/workflows/release\.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (por ejemplo 1.1.0)"
        required: true
  push:
    branches: ["main", "claude/**"]

permissions:
  contents: write # etiqueta y versión en GitHub
  packages: write # imágenes en GHCR
  id-token: write # identidad OIDC para firmar con Sigstore

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    name: Publicar versión
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Publicar versión ')
    runs-on: ubuntu-latest
    env:
      REGISTRO: ghcr.io/insigne123
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: La versión coincide con el sitio y no existe todavía
        env:
          SOLICITADA: ${{ inputs.version }}
        run: |
          declarada=$(jq -r .version apps/site/src/data/release.json)
          VERSION="${SOLICITADA:-$declarada}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          [ "$declarada" = "$VERSION" ] || { echo "release.json dice $declarada, no $VERSION"; exit 1; }
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then echo "la etiqueta v$VERSION ya existe"; exit 1; fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present build
      - run: pnpm -r --if-present test

      - name: SBOM, inventario de licencias y sumas
        run: pnpm sbom

      - uses: sigstore/cosign-installer@v3

      - name: Ingresar a GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Construir, publicar y firmar las imágenes propias
        run: |
          set -euo pipefail
          pnpm --filter @nexo/console-api deploy --prod --legacy apps/console-api/.deploy
          cp apps/console-api/Dockerfile apps/console-api/.deploy/
          declare -A contexto=(
            [nexo-console-api]=apps/console-api/.deploy
            [nexo-console-web]=apps/console-web
            [nexo-motores]=services/engines
          )
          : > "release/$VERSION/IMAGENES.txt"
          for nombre in "${!contexto[@]}"; do
            imagen="$REGISTRO/$nombre:$VERSION"
            docker build --label "org.opencontainers.image.version=$VERSION" \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              -t "$imagen" "${contexto[$nombre]}"
            docker push "$imagen"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$imagen")
            cosign sign --yes "$digest"
            echo "$digest" >> "release/$VERSION/IMAGENES.txt"
          done
          cat "release/$VERSION/IMAGENES.txt"

      - name: Firmar los artefactos de la versión (Sigstore, sin llaves)
        run: |
          cd "release/$VERSION"
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -la

      - name: Etiqueta y versión en GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Yago Nexo $VERSION"
          git push origin "v$VERSION"
          nota="apps/site/blog/$(ls apps/site/blog | grep -E "nexo-${VERSION//./-}\.md$" | head -1)"
          # La nota del sitio sin su encabezado YAML ni el marcador de resumen.
          if [ -f "$nota" ]; then awk 'NR==1 && /^---$/ {f=1; next} f && /^---$/ {f=0; next} !f' "$nota" | grep -v '<!-- truncate -->' | sed 's#](/#](https://yago-nexo.web.app/#g' > /tmp/nota.md; else echo "Yago Nexo $VERSION" > /tmp/nota.md; fi
          cuerpo=/tmp/nota.md
          gh release create "v$VERSION" --title "Yago Nexo $VERSION" --notes-file "$cuerpo" release/"$VERSION"/*
