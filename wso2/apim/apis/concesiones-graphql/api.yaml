# API GraphQL (D-06)
name: ConcesionesGraphQL
version: 1.0.0
context: /graphql/concesiones
description: Consulta GraphQL de concesiones de telecomunicaciones (datos sintéticos de laboratorio).
type: GRAPHQL
contract: schema.graphql
owner:
  business: División de Concesiones (sintético)
  businessEmail: concesiones@ejemplo.invalid
  technical: Equipo DevOps (sintético)
  technicalEmail: devops@ejemplo.invalid
metadata:
