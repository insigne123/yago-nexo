  # ====================================================================== M6 · Observabilidad, continuidad, soporte e incidentes
  - id: M6-01
    modulo: M6
    dificultad: media
    enunciado: "¿Cómo llegan los eventos de analítica del gateway a OpenSearch?"
    opciones:
      a: "API Manager los envía a la nube de WSO2"
      b: "Prometheus los copia"
      c: "En modo log: API Manager los escribe en apim_metrics.log y Fluent Bit los envía al índice nexo-apim-metrics-*, con buffer en disco"
      d: "Jaeger los indexa"
    correcta: c
    justificacion: "La analítica está en modo elk; no se usa la analítica en la nube de WSO2."
    referencia: "deploy/compose/fluent-bit/fluent-bit.yaml"

  - id: M6-02
    modulo: M6
    dificultad: alta
    enunciado: "¿De dónde salen las métricas `nexo_gateway_counter_solicitudes_total` que usan el tablero y las alertas del gateway?"
    opciones:
      a: "De un agente instalado en Keycloak"
      b: "De Fluent Bit, que las deriva de los eventos de analítica (log_to_metrics) y las expone en el puerto 2021"
      c: "Del Dev Portal"
      d: "De OpenSearch Dashboards"
